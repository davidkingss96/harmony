services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harmony-php
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html/api
      - ./frontend:/var/www/html/frontend
      - ./database:/var/www/html/database
    env_file:
      - .env
    command: sh -c "cd /var/www/html/api && composer install --no-dev --optimize-autoloader --no-scripts && cd /var/www/html && until php database/migrate.php; do sleep 2; done && apache2-foreground"
    depends_on:
      - mysql
    networks:
      - harmony-network

  mysql:
    image: mysql:8.0
    container_name: harmony-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - harmony-mysql-data:/var/lib/mysql
    networks:
      - harmony-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: harmony-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - mysql
    networks:
      - harmony-network

volumes:
  harmony-mysql-data:

networks:
  harmony-network:
    driver: bridge
